name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source consistency
        run: |
          python3 tools/verify_source.py
          python3 tools/preflight_android.py
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Prepare native Sherpa-ONNX KWS runtime and wake-word model
        run: bash tools/prepare_sherpa_kws.sh
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare native llama.cpp GGUF runtime
        run: bash tools/prepare_llama_cpp.sh
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EVA-1-2.4.1-debug-compiled
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
